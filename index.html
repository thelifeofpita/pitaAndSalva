<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PITA &amp; SALVA</title>
<link rel="stylesheet" href="style.css">
<!-- the three files that gate the first dap, requested before app.js is parsed -->
<link rel="preload" as="fetch" href="img/frames.json" crossorigin>
<link rel="preload" as="fetch" href="img/ui.json" crossorigin>
<link rel="preload" as="image" href="img/landing_plate.png">
</head>
<body class="booting">
<div id="fit">
  <div id="stage">
    <!-- a canvas, not an <img>: drawImage paints during the call, so a frame can
         never be skipped by a swap that has not finished resolving -->
    <canvas id="plate" width="1920" height="1080"></canvas>

    <!-- landing overlay -->
    <div id="ui">
      <a class="nav" id="nav-salva" href="#salva"><img src="img/ui/salva.png" alt="Salva"></a>
      <a class="nav" id="nav-pita"  href="#pita"><img src="img/ui/pita.png" alt="Pita"></a>
      <a class="nav" id="nav-amp"   href="#and"><img src="img/ui/amp.png" alt="&amp;"></a>

      <div id="hint">drag to hand</div>
      <div class="icon" id="ico-rock"     data-g="rock"><img src="img/ui/rock.png" alt="rock"></div>
      <div class="icon" id="ico-paper"    data-g="paper"><img src="img/ui/paper.png" alt="paper"></div>
      <div class="icon" id="ico-scissors" data-g="scissors"><img src="img/ui/scissors.png" alt="scissors"></div>

      <div id="campaigns"></div>
      <div id="drop-l" class="drop"></div>
      <div id="drop-r" class="drop"></div>
    </div>

    <!-- destination pages -->
    <div id="page">
      <img id="page-img" alt="">
      <div id="and-copy">
        <img class="and-phrase" src="img/and_text/phrase_01.png" alt="One uses a PC. The other, a Mac.">
        <img class="and-phrase" src="img/and_text/phrase_02.png" alt="One weighs his food so he doesn’t go over his limits. The other pushes his limits by weighing which burger is bigger.">
        <img class="and-phrase" src="img/and_text/phrase_03.png" alt="One is into Rage Against the Machine. The other, Juan Luis Guerra.">
        <img class="and-phrase" src="img/and_text/phrase_04.png" alt="One designed the portfolio. The other wrote the About Us.">
        <img class="and-phrase" src="img/and_text/phrase_05.png" alt="An art director with copy headlines. A copywriter with artistic visuals.">
        <img class="and-phrase" src="img/and_text/phrase_06.png" alt="Neither of them is on TikTok.">
        <img class="and-phrase" src="img/and_text/phrase_07.png" alt="Both allergic to oregano, peanuts and fantasy ideas with fantasy budgets for fantasy people who live in the fantasy minds of the so-called creatives.">
        <img class="and-phrase" src="img/and_text/phrase_08.png" alt="Ultimately, two so-called creative jerks.">
      </div>
      <div id="page-extra"></div>
      <!-- Back is the other person's hand reaching in from the edge the landing
           is behind: Salva's on Pita's page, Pita's on Salva's, both of them on
           the & and on a project. All four hands are in the markup and the
           back-* side on #page picks which are shown, so the control never
           waits on an image swap. The span keeps the hands' own wiggle clear of
           the centring transform on the button. -->
      <button id="back" type="button" aria-label="Back">
        <span class="back-in">
          <img class="hand h-salva"   src="img/ui/hand_salva.png" alt="">
          <img class="hand h-pita"    src="img/ui/hand_pita.png" alt="">
          <img class="hand h-salva-v" src="img/ui/hand_salva_v.png" alt="">
          <img class="hand h-pita-v"  src="img/ui/hand_pita_v.png" alt="">
        </span>
      </button>
    </div>

    <div id="ghost"><img alt=""></div>
  </div>
</div>
<script src="app.js"></script>
<script>
/* Keeps the frames in Cache Storage, where the host's ten-minute max-age does
   not reach them. Progressive: without it the page works exactly as before. */
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
